<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--gold:#c9c9ad;--hover-color:#ceba7b;--adjacent:#c9c9ad;--white:#556775;--muted:#556775;--used:#273043;--bar:#556775;--font:12px;--hover:16px;--rest:1}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;user-select:none}
body{display:flex;align-items:center;justify-content:center;background:transparent}.side{width:100%;height:100%;padding:28px 18px 28px 12px;display:flex;flex-direction:column;justify-content:center}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;max-height:var(--list-height,253px);overflow:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none}.list::-webkit-scrollbar{display:none}
.item{height:22px;display:grid;grid-template-columns:60px minmax(0,1fr);align-items:center;gap:12px;cursor:pointer;position:relative}.item:before{content:"";position:absolute;inset:-5px -10px}.lines{height:22px;display:block;position:relative;z-index:1}.item .long,.item .short{position:absolute;left:0;top:10px}.item .short{top:26px;left:0;align-self:auto}.right-side .item .long,.right-side .item .short{left:auto;right:0}.right-side .item .short{right:0}.long,.short{height:1px;background:var(--muted);width:60px;transform-origin:left center}.short{width:30px;align-self:center}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--font) + (var(--hover) - var(--font))*var(--effect,0));line-height:1.2;font-weight:500;position:relative;color:var(--row-color,var(--muted));transition:color 100ms linear;transform:translateX(calc(var(--effect,0)*24px));transform-origin:left center}.item .long,.item .short{background:var(--row-color,var(--muted));transition:background-color 100ms linear}.item .long{transform:scaleX(calc(.7 + var(--effect,0)*.5))}
.quota{margin:27px 0 13px 3px;width:172px;display:flex;flex-direction:column;gap:9px}.quota-row{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;white-space:nowrap}.bars{width:120px;height:9px;display:flex;flex:0 0 120px;gap:2px;align-items:center}.bars i{width:4px;height:9px;flex:0 0 4px;background:var(--bar);border-radius:2px;transform:scaleY(var(--lift,1));transform-origin:center;transition:transform 90ms linear}.bars i.on{background:var(--used)}
body.right-side .side{padding:28px 12px 28px 18px;align-items:flex-end}.right-side .list{width:100%}.right-side .item{grid-template-columns:minmax(0,1fr) 60px}.right-side .lines{grid-column:2;align-items:flex-end}.right-side .name{grid-column:1;text-align:right;transform:translateX(calc(var(--effect,0)*-24px));transform-origin:right center}.right-side .long,.right-side .short{transform-origin:right center}.right-side .quota{margin-left:0;margin-right:3px;align-items:flex-end}.right-side .quota-row{flex-direction:row-reverse}.right-side .shadow{align-self:flex-end}
.shadow{--x:0px;--s:0px;--p:0%;--icon:#556775;width:58px;height:24px;border:0;border-radius:13px;overflow:hidden;background:linear-gradient(90deg,#252d3a 0%,#252d3a 25%,#556775 75%,#556775 100%);background-position-x:var(--p);background-size:400% auto;position:relative;padding:0;cursor:pointer;transition:background-position .6s ease,transform .18s ease}.shadow:before{content:"";position:absolute;left:8px;right:8px;top:4px;height:1px;background:#556775;box-shadow:0 14px 0 #556775;transform:translateX(var(--s));transition:transform .3s,color .3s,background-color .3s;z-index:0}.shadow:after{content:"";display:block;position:absolute;left:14px;top:1px;width:2px;height:2px;border-radius:50%;background:#f6f2e7;opacity:.5;animation:lights2 2s linear infinite;box-shadow:0 21px 0 rgba(246,242,231,.5),8px 0 0 rgba(246,242,231,.25),8px 21px 0 rgba(246,242,231,.25),16px 0 0 rgba(246,242,231,.25),16px 21px 0 rgba(246,242,231,.25);z-index:0}.street-middle{position:absolute;top:11px;left:21px;width:3px;height:1px;background:#556775;box-shadow:5px 0 0 #556775,10px 0 0 #556775,15px 0 0 #556775,20px 0 0 #556775,25px 0 0 #556775;transform:translateX(var(--s));transition:transform .3s,background-color .3s;z-index:0}.cloud{position:absolute;top:7px;left:100%;width:12px;height:4px;border-radius:3px;background:#f6f2e7;opacity:0;transition:opacity .3s;animation:clouds2 2s linear infinite;z-index:0}.cloud:before,.cloud:after{content:"";position:absolute;bottom:1px;left:1px;width:5px;height:5px;border-radius:50%;background:#f6f2e7}.cloud:after{left:5px;bottom:1px;width:6px;height:6px}.cloud.two{top:17px;animation-delay:1s}.shadow-icon{position:absolute;left:2px;top:2px;width:20px;height:20px;border:1px solid var(--icon);border-radius:50%;color:var(--icon);display:flex;align-items:center;justify-content:center;transform:translateX(var(--x));transition:transform .6s cubic-bezier(.2,.8,.35,1.2),color .6s,border-color .6s;z-index:2}.shadow-icon svg{display:block;width:14px;height:9px;fill:currentColor;transition:color .6s}.shadow.off{--p:0%;--x:0px;--s:0px;--icon:#556775}.shadow.off .street-middle{background:#556775;box-shadow:5px 0 0 #556775,10px 0 0 #556775,15px 0 0 #556775,20px 0 0 #556775,25px 0 0 #556775}.shadow.pending-on,.shadow:not(.off){--p:100%;--x:34px;--s:-42px;--icon:#f6f2e7}.shadow.pending-on .street-middle,.shadow:not(.off) .street-middle{background:#f6f2e7;box-shadow:5px 0 0 #f6f2e7,10px 0 0 #f6f2e7,15px 0 0 #f6f2e7,20px 0 0 #f6f2e7,25px 0 0 #f6f2e7}.shadow.pending-on .cloud,.shadow:not(.off) .cloud{opacity:.8}.shadow.pending-off{--p:0%;--x:0px;--s:0px;--icon:#556775}.shadow.pending-off .cloud{opacity:0}@keyframes lights2{20%,30%{opacity:.35;box-shadow:0 21px 0 rgba(246,242,231,.35),8px 0 0 #f6f2e7,8px 21px 0 #f6f2e7,16px 0 0 rgba(246,242,231,.25),16px 21px 0 rgba(246,242,231,.25)}55%,65%{opacity:.35;box-shadow:0 21px 0 rgba(246,242,231,.25),8px 0 0 rgba(246,242,231,.25),8px 21px 0 rgba(246,242,231,.25),16px 0 0 #f6f2e7,16px 21px 0 #f6f2e7}90%,100%{opacity:.5;box-shadow:0 21px 0 rgba(246,242,231,.5),8px 0 0 rgba(246,242,231,.25),8px 21px 0 rgba(246,242,231,.25),16px 0 0 rgba(246,242,231,.25),16px 21px 0 rgba(246,242,231,.25)}}@keyframes clouds2{0%{transform:translateX(0);visibility:hidden}1%{visibility:visible}97%{transform:translateX(-72px);visibility:visible}98%,100%{visibility:hidden;transform:translateX(-72px)}}.shadow:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
.shadow:before{left:0;right:0}.shadow-icon{background:var(--knob-bg,#252d3a)}.shadow.off{--knob-bg:#252d3a}.shadow.pending-on,.shadow:not(.off){--knob-bg:#556775}.shadow.pending-off{--knob-bg:#252d3a}
.shadow:before{background:#2a3f52;box-shadow:0 14px 0 #2a3f52}.street-middle{background:#2a3f52;box-shadow:5px 0 0 #2a3f52,10px 0 0 #2a3f52,15px 0 0 #2a3f52,20px 0 0 #2a3f52,25px 0 0 #2a3f52}.shadow.off .street-middle{background:#2a3f52;box-shadow:5px 0 0 #2a3f52,10px 0 0 #2a3f52,15px 0 0 #2a3f52,20px 0 0 #2a3f52,25px 0 0 #2a3f52}.shadow.pending-on,.shadow:not(.off):not(.pending-off){--s:-62px}.cloud,.cloud:before,.cloud:after{background:#2a3f52}.cloud{filter:drop-shadow(0 0 .8px #f6f2e7)}


.shadow:after{display:none!important}.shadow{background-image:linear-gradient(90deg,var(--shadow-off,#252d3a) 0%,var(--shadow-off,#252d3a) 25%,var(--shadow-on,#556775) 75%,var(--shadow-on,#556775) 100%)}.shadow.off,.shadow.pending-off{--icon:var(--shadow-off-icon,#556775)}.shadow.pending-on,.shadow:not(.off):not(.pending-off){--icon:var(--shadow-on-icon,#f6f2e7)}.shadow:before,.street-middle{background:var(--road-color,#2a3f52);box-shadow:0 14px 0 var(--road-color,#2a3f52)}.street-middle{box-shadow:5px 0 0 var(--road-color,#2a3f52),10px 0 0 var(--road-color,#2a3f52),15px 0 0 var(--road-color,#2a3f52),20px 0 0 var(--road-color,#2a3f52),25px 0 0 var(--road-color,#2a3f52)}.cloud,.cloud:before,.cloud:after{background:var(--cloud-color,#2a3f52)}.shadow{zoom:.375}

</style>
</head>
<body><main class="side"><ul class="list" id="items"></ul><section class="quota"><div class="quota-row"><span class="bars" id="five"></span><span>五时 <b id="fiveText">不可用</b></span></div><div class="quota-row"><span class="bars" id="week"></span><span>每周 <b id="weekText">不可用</b></span></div></section><button class="shadow off" id="shadow" aria-label="Shadowrocket 连接状态" title="Shadowrocket"><span class="street-middle"></span><span class="cloud"></span><span class="cloud two"></span><span class="shadow-icon" aria-hidden="true"><svg viewBox="0 0 310.95 181.02" aria-hidden="true"><path d="M103.94,125.13c-21.56-8.48-26.69-36.48-15.88-55.8,3.71-6.64,9.19-11.08,16.25-13.99L93.52.05c27.42-.74,49.97,6.17,68.02,24.94,12.1-.45,23.42-.98,35.34-.04,45.78,3.61,90.53,24.66,114.08,65.55-9.97,17.51-24.14,31.01-40.86,41.76-12.49,7.74-25.34,13.18-39.49,17.4-22.78,6.18-45.6,8.12-69.31,6.28-18.38,20.19-41.4,25.28-68.2,25.05l10.84-55.88ZM118.83,118.42l-9.45,47.5c20.2.15,38.01-7.62,51.06-22.37,37.03,3.38,73.12-3.03,103.53-24.34,10.98-7.69,20.29-16.75,26.82-28.62-28.63-42.92-79.81-56.38-129.72-52.1-14.3-15.5-29.15-22.08-50.95-23.13l9.35,47.67c-9.46,3.36-16.5,9.56-19.23,17.43-5.64,16.25,1.46,30.99,18.6,37.97Z"/><path d="M0,90.11c10.71-7.89,22.24-14.37,34.81-18.98s25.6-2.03,33.49,8.14c5.79,7.46,4.9,17.1-1.32,23.98-8.1,8.59-20.04,10.4-31.42,6.86-12.63-4.52-23.83-10.81-35.57-20Z"/><path d="M211.97,118.24c-15.33,0-27.75-12.43-27.75-27.75s12.43-27.75,27.75-27.75,27.75,12.43,27.75,27.75-12.43,27.75-27.75,27.75ZM212,106.09c8.82,0,15.98-7.15,15.98-15.98s-7.15-15.98-15.98-15.98-15.98,7.15-15.98,15.98,7.15,15.98,15.98,15.98Z"/></svg></span></button></main>
<script>
const list=document.querySelector('#items'),shadow=document.querySelector('#shadow');let raf=0,lastPointer=null;
function startAnimation(){if(raf)return;let last=performance.now();const frame=now=>{const k=1-Math.exp(-Math.min(now-last,50)/100);last=now;let moving=false;list.querySelectorAll('.item').forEach(el=>{const current=Number.parseFloat(el.style.getPropertyValue('--effect'))||0,target=Number.parseFloat(el.dataset.target)||0,next=current+(target-current)*k;el.style.setProperty('--effect',next.toFixed(4));if(Math.abs(target-next)>.0015)moving=true});if(moving)raf=requestAnimationFrame(frame);else raf=0};raf=requestAnimationFrame(frame)}
function resetHover(){list.querySelectorAll('.item').forEach(el=>{el.dataset.target='0';el.style.setProperty('--row-color','var(--muted)')});startAnimation()}
function updateHover(clientY){const rows=[...list.querySelectorAll('.item')];if(!rows.length){resetHover();return}let nearest=0,nearestDistance=Infinity;rows.forEach((el,i)=>{const rect=el.getBoundingClientRect(),distance=Math.abs(clientY-(rect.top+rect.height/2)),linear=Math.max(0,1-distance/100),smooth=linear*linear*(3-2*linear);el.dataset.target=String(smooth);if(distance<nearestDistance){nearestDistance=distance;nearest=i}});rows.forEach((el,i)=>el.style.setProperty('--row-color',i===nearest?'var(--hover-color)':Math.abs(i-nearest)===1?'var(--adjacent)':'var(--muted)'));startAnimation()}
function pointerMoveAt(clientX,clientY){const rect=list.getBoundingClientRect();if(clientX<rect.left||clientX>rect.right||clientY<rect.top||clientY>rect.bottom){resetHover();return}updateHover(clientY)}
function render(items,count=8){list.replaceChildren();const visible=Math.max(1,Math.min(30,Number(count)||8));document.documentElement.style.setProperty('--list-height',`${visible*22+(visible-1)*11}px`);(items||[]).forEach(item=>{const li=document.createElement('li');li.className='item';li.style.setProperty('--effect','0');li.dataset.target='0';const lines=document.createElement('span');lines.className='lines';lines.innerHTML='<i class="long"></i><i class="short"></i>';const name=document.createElement('span');name.className='name';name.textContent=item.title;name.title=name.textContent;li.append(lines,name);li.addEventListener('click',()=>{resetHover();window.webkit?.messageHandlers?.sidebar?.postMessage(item.actionID?{actionID:item.actionID}:{index:item.index})});list.append(li)});list.onpointermove=e=>pointerMoveAt(e.clientX,e.clientY);list.onpointerleave=resetHover}
window.nativePointerMove=pointerMoveAt;window.nativePointerLeave=resetHover;window.addEventListener('blur',resetHover)
function setBars(id,value){const root=document.querySelector('#'+id);root.replaceChildren();const used=Number.isFinite(value)?Math.round((100-Math.max(0,Math.min(100,value)))/5):0;for(let i=0;i<20;i++){const bar=document.createElement('i');bar.className=i<used?'on':'';root.append(bar)}attachWake(root)}
function attachWake(root){root.onpointermove=e=>{const r=root.getBoundingClientRect(),now=performance.now(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(root.children.length-1),speed=lastPointer?Math.abs(e.clientX-lastPointer.x)/Math.max(1,now-lastPointer.t):0,amp=Math.min(1,speed*1.7),dir=lastPointer?Math.sign(e.clientX-lastPointer.x)||1:1,reach=1.5+4.5*amp;lastPointer={x:e.clientX,t:now};for(let i=0;i<root.children.length;i++){const d=i-x,R=(d*dir<0?reach*1.6:reach*.7),lift=Math.abs(d)<R?amp*Math.cos(Math.PI*d/(2*R))**2:0;root.children[i].style.setProperty('--lift',String(1+lift*.78))}};root.onpointerleave=()=>{lastPointer=null;for(const bar of root.children)bar.style.setProperty('--lift','1')}}
function setStatus(five,week,connected){shadow.classList.remove('pending-on','pending-off');setBars('five',five);setBars('week',week);document.querySelector('#fiveText').textContent=Number.isFinite(five)?String(Math.round(five)).padStart(2,'0'):'不可用';document.querySelector('#weekText').textContent=Number.isFinite(week)?String(Math.round(week)).padStart(2,'0'):'不可用';shadow.classList.toggle('off',!connected);shadow.setAttribute('aria-pressed',String(connected))}
function toggleShadow(){const connected=shadow.getAttribute('aria-pressed')==='true';shadow.classList.remove('pending-on','pending-off');void shadow.offsetWidth;shadow.classList.add(connected?'pending-off':'pending-on');window.setTimeout(()=>shadow.classList.remove('pending-on','pending-off'),2000);window.webkit?.messageHandlers?.sidebar?.postMessage({action:'shadowrocketToggle'})}shadow.onclick=toggleShadow;const openSidebarMenu=e=>{if(e.target.closest('.item,.shadow'))return;e.preventDefault();e.stopPropagation();window.webkit?.messageHandlers?.sidebar?.postMessage({action:'contextMenu',x:e.clientX,y:e.clientY})};document.addEventListener('dblclick',openSidebarMenu,true);window.setItems=render;window.setStatus=setStatus;window.setFonts=(base,hover)=>{document.documentElement.style.setProperty('--font',`${Math.min(72,Math.max(1,Number(base)||9))*1.333}px`);document.documentElement.style.setProperty('--hover',`${Math.min(72,Math.max(1,Number(hover)||12))*1.333}px`)};window.setColors=colors=>{document.documentElement.style.setProperty('--white',colors[0]);document.documentElement.style.setProperty('--muted',colors[1]);document.documentElement.style.setProperty('--adjacent',colors[2]);document.documentElement.style.setProperty('--hover-color',colors[3]);document.documentElement.style.setProperty('--used',colors[4]);document.documentElement.style.setProperty('--bar',colors[5]);document.documentElement.style.setProperty('--shadow-on',colors[6]);document.documentElement.style.setProperty('--shadow-on-icon',colors[7]);document.documentElement.style.setProperty('--shadow-off',colors[8]);document.documentElement.style.setProperty('--shadow-off-icon',colors[9]);document.documentElement.style.setProperty('--road-color',colors[10]);document.documentElement.style.setProperty('--cloud-color',colors[11])};window.setSide=side=>document.body.classList.toggle('right-side',side==='右侧');window.setOpacity=()=>{};render([]);setStatus(null,null,false);
</script></body></html>
