const bridge=(action,data={})=>window.webkit?.messageHandlers?.settings?.postMessage({action,...data});let state={groups:{codex:[],cli:[],application:[]},selectedItems:[],quickActions:[],quota5:null,quotaWeek:null};let page=0,projectSearchQuery='';const content=document.querySelector('#content');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=+b.dataset.page;bridge('page',{page});render()});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function row(item){const defaultName=item.displayName||item.title;return `<div class="row" data-path="${esc(item.path)}"><input type="checkbox" ${item.enabled?'checked':''}><span class="itemname" data-index="${item.index}" title="${esc(item.title)}"><span>${esc(item.title)}</span></span><input class="rename" value="${esc(item.name||defaultName)}" aria-label="侧栏显示名称"></div>`}
content.addEventListener('change',e=>{const rowEl=e.target.closest('.row');if(!rowEl)return;if(e.target.matches('input[type=checkbox]'))bridge('enabled',{path:rowEl.dataset.path,enabled:e.target.checked});else if(e.target.matches('.rename'))bridge('rename',{path:rowEl.dataset.path,value:e.target.value})});content.addEventListener('click',e=>{const target=e.target.closest('.itemname');if(target)bridge('item',{index:Number(target.dataset.index)})});

function openQuickActionEditor(id){const existing=(state.quickActions||[]).find(a=>a.id===id);const action=existing?{...existing}:{id:'action-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name:'',kind:'server',enabled:true,url:'',username:'',password:'',appPath:'',steps:[],clicks:[],shortcutName:'',command:'',scriptPath:'',arguments:'',workingDirectory:'',showTerminal:true,startupDelay:5};let draftClicks=action.clicks||[];const backdrop=document.createElement('div');backdrop.className='quick-modal-backdrop';backdrop.innerHTML='<section class="quick-modal" role="dialog" aria-modal="true"><div style="display:flex;justify-content:space-between;align-items:start"><div><h2>'+(existing?'编辑':'添加')+'快捷操作</h2><div class="modal-sub">配置操作内容与侧栏显示。</div></div><button class="sort-close" type="button" aria-label="关闭">×</button></div><div class="quick-formrow"><label for="quickName">侧栏名称</label><input class="quick-input" id="quickName" value="'+esc(action.name)+'" placeholder="例如：工作资料 WebDAV"></div><div class="quick-formrow"><label for="quickKind">操作类型</label><select class="quick-select" id="quickKind">'+Object.keys(quickKindNames).map(k=>'<option value="'+k+'" '+(action.kind===k?'selected':'')+'>'+quickKindNames[k]+'</option>').join('')+'</select></div><div id="quickActionFields"></div><div class="quick-formrow"><label for="quickEnabled">侧栏显示</label><label class="hint"><input id="quickEnabled" type="checkbox" '+(action.enabled?'checked':'')+'> 勾选后显示在桌面侧栏</label></div><div class="quick-modal-actions"><button type="button" class="cancel">取消</button><button type="button" class="save">保存</button></div></section>';document.body.append(backdrop);const close=()=>backdrop.remove();backdrop.querySelector('.sort-close').onclick=close;backdrop.querySelector('.cancel').onclick=close;backdrop.addEventListener('click',e=>{if(e.target===backdrop)close()});const kindSelect=backdrop.querySelector('#quickKind');function val(id){return backdrop.querySelector('#'+id)?.value||''}function drawFields(){action.name=val('quickName')||action.name;action.url=val('qaURL')||action.url;action.username=val('qaUsername')||action.username;action.password=val('qaPassword')||action.password;action.appPath=val('qaAppPath')||action.appPath;action.shortcutName=val('qaShortcut')||action.shortcutName;action.command=val('qaCommand')||action.command;action.scriptPath=val('qaScriptPath')||action.scriptPath;action.arguments=val('qaArgs')||action.arguments;action.workingDirectory=val('qaWorkdir')||action.workingDirectory;action.showTerminal=backdrop.querySelector('#qaShowTerminal')?.checked??action.showTerminal;const delay=val('qaStartupDelay');if(delay!=='')action.startupDelay=Number(delay);action.steps=val('qaSteps').split('\n').map(x=>x.trim()).filter(Boolean);const kind=kindSelect.value;let html='';if(kind==='server'||kind==='url'){html='<div class="quick-formrow"><label for="qaURL">'+(kind==='server'?'服务器地址':'网址')+'</label><div><input class="quick-input" id="qaURL" value="'+esc(action.url)+'" placeholder="'+(kind==='server'?'https://…/webdav 或 ftp://…':'https://example.com')+'"><div class="quick-help">点击后由 macOS 或已安装客户端打开地址。</div></div></div>'+(kind==='server'?'<div class="quick-formrow"><label for="qaUsername">账号</label><input class="quick-input" id="qaUsername" value="'+esc(action.username)+'"></div><div class="quick-formrow"><label for="qaPassword">密码</label><input class="quick-input" id="qaPassword" type="password" value="'+esc(action.password)+'"></div>':'')}if(kind==='app'){html='<div class="quick-formrow"><label>目标 app</label><div style="display:flex;gap:5px"><input class="quick-input" id="qaAppPath" value="'+esc(action.appPath)+'" placeholder="选择一个 .app" readonly><button class="button select-icon-button" type="button" id="pickApp" aria-label="选择 app" title="选择 app"><img src="select.svg" alt=""></button></div></div><div class="quick-formrow"><label>界面等待</label><div><input class="quick-input" id="qaStartupDelay" type="number" min="0" max="120" step="0.5" value="'+esc(action.startupDelay??5)+'" style="max-width:110px"> 秒<div class="quick-help">打开 app 后等待界面加载，再执行点击；较慢的 app 可调大，最多 120 秒。</div></div></div><div class="quick-formrow"><label>点击动作</label><div><button class="button record-clicks" type="button" id="recordClicks">开始录制</button><span class="quick-help" id="clickCount">已录制 '+draftClicks.length+' 次点击</span><div class="quick-help">打开目标 app 后逐次录制实际点击位置。</div></div></div>'}if(kind==='shortcut'){html='<div class="quick-formrow"><label for="qaShortcut">快捷指令名称</label><div><div style="display:flex;gap:5px"><input class="quick-input" id="qaShortcut" value="'+esc(action.shortcutName)+'" placeholder="快捷指令名称"><button type="button" class="button select-icon-button" id="importShortcut" aria-label="导入快捷指令" title="导入快捷指令"><img src="select.svg" alt=""></button></div></div></div>'}if(kind==='terminal'){html='<div class="quick-formrow"><label for="qaCommand">终端命令</label><div><textarea class="quick-area" id="qaCommand" placeholder="输入要运行的命令">'+esc(action.command)+'</textarea><div class="quick-help">可以在终端窗口中执行。</div></div></div><div class="quick-formrow"><label for="qaWorkdir">工作目录</label><input class="quick-input" id="qaWorkdir" value="'+esc(action.workingDirectory)+'" placeholder="可留空"></div><div class="quick-formrow"><label for="qaShowTerminal">运行方式</label><label class="hint"><input id="qaShowTerminal" type="checkbox" '+(action.showTerminal?'checked':'')+'> 在终端窗口运行</label></div>'}if(kind==='python'){html='<div class="quick-formrow"><label>Python 程序</label><div style="display:flex;gap:5px"><input class="quick-input" id="qaScriptPath" value="'+esc(action.scriptPath)+'" placeholder="选择 .py 文件" readonly><button class="button select-icon-button" type="button" id="pickPython" aria-label="选择 Python 程序" title="选择 Python 程序"><img src="select.svg" alt=""></button></div></div><div class="quick-formrow"><label for="qaArgs">参数</label><input class="quick-input" id="qaArgs" value="'+esc(action.arguments)+'" placeholder="可留空"></div><div class="quick-formrow"><label for="qaWorkdir">工作目录</label><input class="quick-input" id="qaWorkdir" value="'+esc(action.workingDirectory)+'" placeholder="可留空"></div><div class="quick-formrow"><label for="qaShowTerminal">运行方式</label><label class="hint"><input id="qaShowTerminal" type="checkbox" '+(action.showTerminal?'checked':'')+'> 在终端窗口运行</label></div>'}backdrop.querySelector('#quickActionFields').innerHTML=html;backdrop.querySelector('#pickApp')?.addEventListener('click',()=>bridge('chooseFile',{kind:'app'}));backdrop.querySelector('#pickPython')?.addEventListener('click',()=>bridge('chooseFile',{kind:'python'}));backdrop.querySelector('#importShortcut')?.addEventListener('click',()=>bridge('importShortcut'));backdrop.querySelector('#recordClicks')?.addEventListener('click',()=>bridge('startClickRecording',{id:action.id,appPath:val('qaAppPath')}))}kindSelect.onchange=drawFields;drawFields();backdrop.querySelector('.save').onclick=()=>{const v=id=>backdrop.querySelector('#'+id)?.value||'';const checked=id=>backdrop.querySelector('#'+id)?.checked??true;action.name=v('quickName').trim();if(!action.name){backdrop.querySelector('#quickName').focus();return}action.kind=kindSelect.value;action.enabled=checked('quickEnabled');action.url=v('qaURL');action.username=v('qaUsername');action.password=v('qaPassword');action.appPath=v('qaAppPath');action.startupDelay=Math.max(0,Math.min(120,Number(v('qaStartupDelay')||5)));action.steps=v('qaSteps').split('\n').map(x=>x.trim()).filter(Boolean);action.clicks=draftClicks;action.shortcutName=v('qaShortcut').trim();action.command=v('qaCommand');action.scriptPath=v('qaScriptPath');action.arguments=v('qaArgs');action.workingDirectory=v('qaWorkdir');action.showTerminal=checked('qaShowTerminal');bridge('quickActionSave',{item:action});close()};window.setRecordedClicks=payload=>{if(!payload||payload.id!==action.id)return;draftClicks=payload.clicks||[];const label=backdrop.querySelector('#clickCount');if(label)label.textContent='已录制 '+draftClicks.length+' 次点击'}}
window.setPickedFile=payload=>{if(!payload)return;if(payload.kind==='app'){const field=document.querySelector('#qaAppPath');if(field)field.value=payload.path}if(payload.kind==='python'){const field=document.querySelector('#qaScriptPath');if(field)field.value=payload.path}if(payload.kind==='shortcut'){const field=document.querySelector('#qaShortcut');if(field)field.value=payload.name}};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=+b.dataset.page;bridge('page',{page});render()});
</script></body></html>
