x;height:1px;background:var(--pvroad,#2a3f52);box-shadow:0 14px 0 var(--pvroad,#2a3f52);transition:transform .3s}.preview-road:after{content:'';position:absolute;left:21px;top:7px;width:16px;height:1px;background:repeating-linear-gradient(90deg,var(--pvroad,#2a3f52) 0 3px,transparent 3px 5px)}.preview-cloud{position:absolute;left:100%;top:7px;width:12px;height:4px;border-radius:3px;background:var(--pvcloud,#2a3f52);opacity:0;transition:left .3s,opacity .3s}.preview-cloud:before,.preview-cloud:after{content:'';position:absolute;left:1px;bottom:1px;width:5px;height:5px;border-radius:50%;background:var(--pvcloud,#2a3f52)}.preview-cloud:after{left:5px;width:6px;height:6px}.switch:not(.off) .preview-road{transform:translateX(-62px)}.switch:not(.off) .preview-cloud{left:26px;opacity:.9}.switch:not(.off){background:var(--pvon,#556775)}.switch:after{content:'';display:none}.switch img{position:absolute;right:2px;top:2px;width:20px;height:20px;padding:3px;border:1px solid var(--pvofficon,#556775);border-radius:50%;background:var(--pvoff,#252d3a);object-fit:contain;transition:left .18s}.switch.off img{left:2px;right:auto}.switch:not(.off) img{border-color:var(--pvonicon,#f6f2e7);background:var(--pvon,#556775)}.generals{padding:3px 4px}.g-row{display:grid;grid-template-columns:1fr auto;align-items:center;min-height:48px;padding:6px 14px;border-bottom:1px solid #dae0eb;background:rgba(255,255,255,.14)}.g-row:first-child{border-radius:9px 9px 0 0}.g-row:last-child{border:0;border-radius:0 0 9px 9px}.g-label{font-size:13px;font-weight:650}.g-help{font-size:11px;color:var(--muted)}.toggle{width:44px;height:24px;border-radius:14px;border:0;background:#b7c0ca;position:relative;cursor:pointer}.toggle:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;background:white;border-radius:50%;transition:.18s}.toggle.on{background:#d6b24c}.toggle.on:after{left:23px}.side{width:100px}.number-input{width:88px;min-width:88px;text-align:center}.number-wrap{display:flex;ali </style></head><body><div class="brand">call via codex</div><div class="layout"><nav class="nav"><button data-page="0"><span class="ico">☷</span>项目列表</button><button data-page="1"><span class="ico">◉</span>界面设置</button><button data-page="2"><span class="ico">⚙</span>通用设置</button><button data-page="3"><span class="ico"><img class="app-mark" src="app-mark.svg" alt=""></span>关于应用</button></nav><main class="content" id="content"></main></div><script>
const bridge=(action,data={})=>window.webkit?.messageHandlers?.settings?.postMessage({action,...data});let state={groups:{codex:[],cli:[],application:[]},quota5:null,quotaWeek:null};let page=0,projectSearchQuery='';const content=document.querySelector('#content');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=+b.dataset.page;bridge('page',{page});render()});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function row(item){const defaultName=item.displayName||item.title;return `<div class="row" data-path="${esc(item.path)}"><input type="checkbox" ${item.enabled?'checked':''}><span class="itemname" data-index="${item.index}" title="${esc(item.title)}"><span>${esc(item.title)}</span></span><input class="rename" value="${esc(item.name||defaultName)}" aria-label="侧栏显示名称"></div>`}
content.addEventListener('change',e=>{const rowEl=e.target.closest('.row');if(!rowEl)return;if(e.target.matches('input[type=checkbox]'))bridge('enabled',{path:rowEl.dataset.path,enabled:e.target.checked});else if(e.target.matches('.rename'))bridge('rename',{path:rowEl.dataset.path,value:e.target.value})});content.addEventListener('click',e=>{const target=e.target.closest('.itemname');if(target)bridge('item',{index:Number(target.dataset.index)})});
function filteredItems(group){const q=(document.querySelector('#projectSearch')?.value||'').trim().toLocaleLowerCase();return(state.groups[group]||[]).filter(x=>!q||[x.title,x.displayName,x.name,x.path].some(v=>String(v||'').toLocaleLowerCase().includes(q)))}function col(title,group,hint){const list=state.groups[group]||[];return `<section class="col"><div class="colhead">${title} <span class="count" id="count-${group}">(${list.length})</span></div><div class="colhint">${hint}</div><div class="rows" data-group="${group}"></div></section>`}function appendRows(container){const items=filteredItems(container.dataset.group),start=Number(container.dataset.loaded||0),end=Math.min(start+20,items.length);if(start===0&&!items.length){container.innerHTML='<div class="empty">未找到匹配项目</div>';return}container.insertAdjacentHTML('beforeend',items.slice(start,end).map(row).join(''));container.dataset.loaded=String(end)}function fillColumns(){document.querySelectorAll('.rows[data-group]').forEach(container=>{appendRows(container);container.onscroll=()=>{if(container.scrollTop+container.clientHeight>=container.scrollHeight-90&&Number(container.dataset.loaded)<filteredItems(container.dataset.group).length)appendRows(container)}});const search=document.querySelector('#projectSearch');if(search)search.oninput=()=>{projectSearchQuery=search.value;document.querySelectorAll('.rows[data-group]').forEach(container=>{container.replaceChildren();container.dataset.loaded='0';appendRows(container)});document.querySelectorAll('.col').forEach(col=>{const group=col.querySelector('.rows').dataset.group;col.querySelector('.count').textContent=`(${filteredItems(group).length})`})}}function ticks(p){const remaining=Number.isFinite(p)?Math.max(0,Math.min(100,p)):0;const used=Math.round((100-remaining)/5);return `<span class="ticks">${Array.from({length:20},(_,i)=>`<i class="${i<used?'on':''}"></i>`).join('')}</span>`}
function preview(){const c=state.colors||[];return `<aside><div class="preview-title">侧栏预览</div><div class="preview" style="--pvtext:${c[0]||'#556775'};--pvmuted:${c[1]||'#556775'};--pvadjacent:${c[2]||'#c9c9ad'};--pvhover:${c[3]||'#ceba7b'};--pvused:${c[4]||'#273043'};--pvbar:${c[5]||'#556775'};--pvon:${c[6]||'#556775'};--pvonicon:${c[7]||'#f6f2e7'};--pvoff:${c[8]||'#252d3a'};--pvofficon:${c[9]||'#556775'};--pvroad:${c[10]||'#2a3f52'};--pvcloud:${c[11]||'#2a3f52'}"><div class="preview-list">${['示例项目','示例项目','示例项目'].map((n,i)=>`<div class="preview-item ${i===1?'active':i===0?'adjacent':''}"><span class="preview-lines"><i class="rule"></i><i></i></span><span>${n}</span></div>`).join('')}</div><div class="quota"><div class="quota-row">${ticks(state.quota5)}<span>五时 ${Number.isFinite(state.quota5)?String(Math.round(state.quota5)).padStart(2,'0')+'%':'不可用'}</span></div><div class="quota-row">${ticks(state.quotaWeek)}<span>每周 ${Number.isFinite(state.quotaWeek)?String(Math.round(state.quotaWeek)).padStart(2,'0')+'%':'不可用'}</span></div></div><button class="switch ${state.shadowrocket?'':'off'}" aria-label="Shadowrocket"><span class="preview-road"></span><span class="preview-cloud"></span><img src="shadowrocket.svg" alt=""></button></div></aside>`}
function interfacePage(){const base=[['文字（默认）','#556775'],['文字（辅助）','#556775'],['上下相邻项目','#c9c9ad'],['悬停项目','#ceba7b'],['进度（已使用）','#273043'],['进度（未使用）','#556775'],['Shadowrocket 开启底色','#556775'],['开启图标与边框','#f6f2e7'],['Shadowrocket 关闭底色','#252d3a'],['关闭图标与边框','#556775'],['道路','#2a3f52'],['云朵','#2a3f52']];const colors=base.map((x,i)=>[x[0],state.colors?.[i]||x[1]]);return `<div class="interface"><div class="config"><div class="colorarea"><h2>配色设置</h2><div class="hint">输入十六进制颜色值（#RRGGBB），实时预览侧栏效果</div><div class="colors">${colors.map(([n,v],i)=>`<label class="colorlabel">${n}</label><span class="swatch" style="background:${v}" id="swatch${i}"></span><input class="hex" value="${v}" data-color="${i}" onchange="document.querySelector('#swatch${i}').style.background=this.value;bridge('color',{index:${i},value:this.value})">`).join('')}</div></div><div class="display"><div class="displaytitle">显示设置</div><div class="displayrow"><label>侧栏显示名称</label><span class="radio"><input type="radio" name="nm" ${state.customNames!==false?'checked':''} onchange="bridge('nameMode',{custom:true})">自定义名称（优先）</span><span class="radio"><input type="radio" name="nm" ${state.customNames===false?'checked':''} onchange="bridge('nameMode',{custom:false})">使用默认名称</span></div><div class="displayrow"><label>默认字号</label><select class="select" onchange="bridge('font',{key:'default',value:this.value})">${['9 pt','10 pt','11 pt','12 pt'].map(v=>`<option ${v===(state.defaultFont||'9 pt')?'selected':''}>${v}</option>`).join('')}</select><label style="min-width:78px">悬停最大字号</label><select class="select" onchange="bridge('font',{key:'hover',value:this.value})">${['12 pt','11 pt','10 pt'].map(v=>`<option ${v===(state.hoverFont||'12 pt')?'selected':''}>${v}</option>`).join('')}</select></div><div class="buttons"><button class="button" onclick="bridge('resetColors')">恢复默认</button><button class="button primary" onclick="bridge('confirmColors')">确认修改</button></div></div></div>${preview()}</div>`}
function generalPage(){return `<div class="generals"><div class="g-row"><div><div class="g-label">启动时显示设置界面</div><div class="g-help">每次启动应用时，先打开设置界面</div></div><button id="launchToggle" class="toggle ${state.launch!==false?'on':''}" onclick="this.classList.toggle('on');bridge('setting',{key:'showSettingsOnLaunch',value:this.classList.contains('on')})"></button></div><div class="g-row"><div><div class="g-label">随系统启动</div><div class="g-help">登录系统后自动启动 call via codex</div></div><button id="loginToggle" class="toggle ${state.login?'on':''}" onclick="this.classList.toggle('on');bridge('setting',{key:'launchAtLogin',value:this.classList.contains('on')})"></button></div><div class="g-row"><div><div class="g-label">侧栏位置</div><div class="g-help">在桌面边缘显示的位置</div></div><select class="select side" onchange="bridge('side',{value:this.value})"><option ${state.side!=='右侧'?'selected':''}>左侧</option><option ${state.side==='右侧'?'selected':''}>右侧</option></select></div><div class="g-row"><div><div class="g-label">显示数量</div><div class="g-help">侧栏同时显示的项目数，更多项目可在列表内滚动</div></div><label class="number-wrap"><input class="select number-input" type="number" min="1" max="30" step="1" value="${state.displayCount??8}" onchange="bridge('displayCount',{value:Number(this.value)})">个</label></div><div class="g-row"><div><div class="g-label">垂直位置</div><div class="g-help">正值向上，负值向下</div></div><label class="number-wrap"><input class="select number-input" type="number" min="-2000" max="2000" step="1" value="${state.verticalOffset??0}" onchange="bridge('verticalOffset',{value:Number(this.value)})">px</label></div><div class="g-row"><div><div class="g-label">侧栏透明度</div></div><div class="range-wrap"><div class="wake-slider" id="opacityWake">${Array.from({length:20},(_,i)=>`<i class="${i<Math.round((Number(state.opacity)||70)/5)?'on':''}"></i>`).join('')}<input class="range" aria-label="侧栏透明度" type="range" min="20" max="100" value="${state.opacity||70}" oninput="setOpacityValue(this)"></div><b id="op">${state.opacity||70}%</b></div></div><div class="g-row"><div><div class="g-label">扫描与刷新</div><div class="g-help">重新扫描本机的技能、命令行工具与应用程序</div></div><button class="button" onclick="bridge('refresh')">立即扫描</button></div></div><button class="danger" onclick="bridge('quit')">⏻　彻底退出应用</button>`}
function aboutPage(){return `<div class="about"><img src="../call-via-codex.png" alt="call via codex"><h2>call via codex</h2><div class="ver">v1.0.0</div><p>在Codex中快速调用技能与工具。</p><div class="copy">© 北京正笔正心文化发展有限公司</div><a href="#" onclick="bridge('website');return false">https://www.zhengxinshushe.com/</a></div>`}
const openSettingsMenu=e=>{if(e.target.closest('button,input,select,a,.itemname'))return;e.preventDefault();e.stopPropagation();bridge('contextMenu',{x:e.clientX,y:e.clientY})};document.addEventListener('dblclick',openSettingsMenu,true);let wakePointer=null;function setOpacityValue(input){const value=Number(input.value);document.querySelector('#op').textContent=value+'%';const bars=[...document.querySelectorAll('#opacityWake i')];bars.forEach((bar,i)=>{bar.classList.toggle('on',i<Math.round(value/5))});bridge('opacity',{value:value/100})}function wakeOpacityMove(e){const track=document.querySelector('#opacityWake'),bars=[...track.querySelectorAll('i')],rect=track.getBoundingClientRect(),now=performance.now(),x=(e.clientX-rect.left)/rect.width*(bars.length-1),speed=wakePointer?Math.abs(e.clientX-wakePointer.x)/Math.max(1,now-wakePointer.t):0,amp=Math.min(1,speed*1.7),direction=wakePointer?Math.sign(e.clientX-wakePointer.x)||1:1,reach=1.5+4.5*amp;wakePointer={x:e.clientX,t:now};bars.forEach((bar,i)=>{const d=i-x,R=d*direction<0?reach*1.6:reach*.7,lift=Math.abs(d)<R?amp*Math.cos(Math.PI*d/(2*R))**2:0;bar.style.setProperty('--lift',String(1+lift*.78))})}function wakeOpacityLeave(){wakePointer=null;document.querySelectorAll('#opacityWake i').forEach(bar=>bar.style.setProperty('--lift','1'))}function render(){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('selected',+x.dataset.page===page));content.innerHTML=page===0?`<div class="project-page"><input id="projectSearch" class="searchbar" type="search" value="${esc(projectSearchQuery)}" placeholder="搜索技能、插件、命令行工具和应用程序" aria-label="搜索项目"><div class="cols">${col('Codex 技能与插件','codex','已安装的 Codex 技能 / 插件')}${col('命令行工具','cli','可被 Codex 调用的终端工具')}${col('应用程序','application','本机已安装的应用程序')}</div></div>`:page===1?interfacePage():page===2?generalPage():aboutPage();if(page===0)fillColumns();const wake=document.querySelector('#opacityWake');if(wake){wake.onpointermove=wakeOpacityMove;wake.onpointerleave=wakeOpacityLeave}}window.setData=x=>{state={...state,...x};render()};window.setPage=n=>{page=n;render()};window.setLogin=v=>{document.querySelector('#loginToggle')?.classList.toggle('on',v)};render();
</script></body></html>
